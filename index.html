<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preload" href="assets/fonts/rubik-v31-latin-300.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/rubik-v31-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/rubik-v31-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    
    <main class="main__card--container">

      <h1 class="sr-only">Time Tracking Dashboard</h1>

      <div class="main__profile--card">
        <div class="main__profile--background cards">
          <div class="dashboard--timeline">
            <button type="button" class="dashboard--btn">Daily</button>
            <button type="button" class="dashboard--btn">Weekly</button>
            <button type="button" class="dashboard--btn">Monthly</button>
          </div>
        </div>

        <div class="main__profile--foreground cards">
          <div class="main__participant--profile">
            <img class="participant--image" src="assets/images/image-jeremy.png" alt="" width="234" height="234">
            <div class="dashboard--description">
              <span class="text">Report for</span>
              <p class="participant--name">Jeremy Robson</p>
            </div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background orange300">
          <img class="icons" src="assets/images/icon-work.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Work</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time">32hrs</div>
            <div class="previous--time">Last Week - 36hrs</div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background blue300">
          <img class="icons" src="assets/images/icon-play.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Play</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time"></div>
            <div class="previous--time"></div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background pink400">
          <img class="icons" src="assets/images/icon-study.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Study</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time"></div>
            <div class="previous--time"></div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background green400">
          <img class="icons" src="assets/images/icon-exercise.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Exercise</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time"></div>
            <div class="previous--time"></div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background purple700">
          <img class="icons" src="assets/images/icon-social.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Social</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time"></div>
            <div class="previous--time"></div>
          </div>
        </div>
      </div>

      <div class="cards">
        <div class="background yellow300">
          <img class="icons" src="assets/images/icon-self-care.svg" alt="">
        </div>
        <div class="foreground">
          <div class="title--block">
            <h3 class="title">Self Care</h3>
            <img class="icon--ellipsis" src="assets/images/icon-ellipsis.svg" alt="">
          </div>
          <div class="duration">
            <div class="current--time">4hrs</div>
            <div class="previous--time">Last Week - 5hrs</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
